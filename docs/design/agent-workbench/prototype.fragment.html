<script>
(() => {
  const root = document.getElementById('conductor-workbench-preview');
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const phases = ['Working','Clarification','Failure','Complete'];
  const agents = ['Claude Code','Pi','Codex','Amp'];
  const initial = () => ({task:'bug',phase:'Complete',agent:'Claude Code',panel:null,choice:0,hour:0,context:'',draft:'',sent:'',accepted:false,review:false,reviewNote:'',notice:'',stopped:false,focusArtifact:'changes'});
  const saved = window.openai?.widgetState?.privateContent || {};
  let stateRevision = Number(saved.revision) || 0;
  const models = ['full','split'].map(id => ({id, el:document.getElementById('cd-'+id), s:{...initial(),...(saved[id] || {})}, timer:null}));
  for (const m of models) { if(!['bug','question'].includes(m.s.task)) m.s.task='bug'; if(!phases.includes(m.s.phase)) m.s.phase='Complete'; if(!agents.includes(m.s.agent)) m.s.agent='Claude Code'; }
  function persist(){ const data={revision:++stateRevision}; for(const m of models){const {draft,reviewNote,...rest}=m.s;data[m.id]=rest;} window.openai?.setWidgetState({modelContent:{prototype:'Conductor workbench',layouts:['Full workspace','Herdr split']},privateContent:data}).catch(()=>{}); }
  const btn=(action,label,cls='',attrs='')=>`<button type="button" class="cursor-interaction ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
  const kv=(k,v)=>`<div class="cd-keyvalue"><span>${k}</span><span>${v}</span></div>`;
  function steps(m){const bug=m.s.task==='bug';return `<div class="cd-path"><div class="cd-step"><span class="cd-accent">✓</span><div>${bug?'Read retry handler':'Located Los Angeles, CA'}<div class="cd-small">${bug?'payments/retry.rs · 86 lines':'Timezone · America/Los_Angeles'}</div></div></div><div class="cd-step"><span class="cd-accent">✓</span><div>${bug?'Reproduced duplicate charge':'Loaded the hourly forecast'}<div class="cd-small">${bug?'1 regression test failed on the base revision':'Sample forecast · 12 hourly records'}</div></div></div><div class="cd-step"><span class="cd-blue">●</span><div>${bug?'Checking the proposed fix':'Comparing morning and afternoon'}<div class="cd-small">${bug?'cargo test --test payment_retry':'Temperature, wind, and rain probability'}</div></div></div></div>`;}
  function forecast(m){return `<svg class="cd-chart" role="img" aria-label="Illustrative hourly temperature in Los Angeles: 17 degrees at 6 AM, peaking at 29 at 2 PM, then 24 at 6 PM"></svg>`;}
  function drawCharts(m){const svg=m.el.querySelector('.cd-chart');if(!svg)return;const w=svg.getBoundingClientRect().width;if(w<1)return;const values=[17,19,23,27,29,28,24],selected=[0,2,4,6][m.s.hour],x=i=>24+i*(w-48)/6,y=v=>112-(v-15)*5;svg.setAttribute('viewBox',`0 0 ${w} 150`);svg.innerHTML=`<rect x="14" y="20" width="${(w-48)/6*1.65}" height="105" fill="var(--cd-accent-bg)"/><line x1="16" x2="${w-16}" y1="125" y2="125" stroke="var(--cd-line)"/><polyline points="${values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--cd-accent)" stroke-width="2"/>${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===selected?4:2}" fill="var(--cd-accent)"/><text x="${x(i)}" y="${y(v)-12}" text-anchor="middle">${v}°</text>`).join('')}${[0,2,4,6].map(i=>`<text x="${x(i)}" y="145" text-anchor="middle">${String(6+i*2).padStart(2,'0')}</text>`).join('')}`;}
  function bugResult(m){const s=m.s,failed=s.phase==='Failure';return `${failed?`<div class="cd-error"><strong>Concurrent retries still create two charges.</strong><div class="cd-small">Attempt 1 · fix preserved · 17 passed, 1 failed</div></div>`:''}<nav class="cd-artifact-tabs" aria-label="Result views">${btn('artifact-changes','Change','',`aria-pressed="${s.focusArtifact==='changes'}"`)}${btn('artifact-checks',failed?'Checks · 1 failed':'Checks · 18 passed','',`aria-pressed="${s.focusArtifact==='checks'}"`)}</nav><div class="cd-result-grid" data-focus="${s.focusArtifact}"><section class="cd-panel"><div class="cd-panel-label"><span class="cd-kicker">${failed?'Proposed change':'Change'}</span><span class="cd-small">1 file · +2 −1</span></div><strong>payments/retry.rs</strong><div class="cd-diff"><div class="cd-code-line"><i>42</i><span>let payment = request.payment;</span></div><div class="cd-code-line cd-minus"><i>−</i><span>let key = new_payment_key();</span></div><div class="cd-code-line cd-plus"><i>+</i><span>${failed?'let key = cache.get(payment.id);':'let key = payment.idempotency_key;'}</span></div><div class="cd-code-line cd-plus"><i>+</i><span>${failed?'cache.put(payment.id, key);':'gateway.charge_once(key, payment)'}</span></div></div>${btn('evidence-diff','Inspect saved diff →','cd-link')}</section><section class="cd-panel"><div class="cd-panel-label"><span class="cd-kicker">Regression checks</span></div><div class="cd-check-row"><span class="cd-small">Base revision</span><span class="cd-red">1 failing</span></div><div class="cd-check-row"><span class="cd-small">This attempt</span><strong class="${failed?'cd-red':'cd-accent'}">${failed?'17 / 18':'18 / 18'} passed</strong></div><div class="cd-check-list">${btn('evidence-test',`<span class="cd-accent">✓</span><span>Retry after timeout</span>`)}${btn('evidence-test',`<span class="${failed?'cd-red':'cd-accent'}">${failed?'×':'✓'}</span><span>Concurrent retry</span>`)}${btn('evidence-test','<span class="cd-accent">✓</span><span>Different payments</span>')}</div>${btn('evidence-test','Inspect test evidence →','cd-link')}</section></div><div class="cd-finding"><div><span class="cd-kicker">${failed?'Unresolved':'Agent finding'}</span><p>${failed?'The cache read and write are separate. Two requests can both miss the cache.':'A timeout generated a new payment key. Reusing the original key lets the gateway reject duplicate requests.'}</p><div class="cd-actions-inline">${btn('evidence-trace','[1] Request trace','cd-link')}${btn('ask-finding','Ask about this','cd-link')}</div></div></div><div class="cd-small"><span class="cd-amber">! Not checked</span> · live payment provider</div><div class="cd-actions">${failed?btn('retry','Retry fix','cd-primary'):s.accepted?'<strong class="cd-accent">✓ Review accepted in preview</strong>':btn('review','Review & accept','cd-primary')}${failed?btn('evidence-test','Inspect failure','cd-outline'):btn('rerun','Re-run checks','cd-outline')}${btn('receipt','Receipt →','cd-link')}</div>${s.review?`<form class="cd-review" data-form="review"><strong>Accept revision a81c3e9</strong><label class="cd-field">What did you check?<input type="text" name="note" required value="${escape(s.reviewNote)}" placeholder="Reviewed the diff and concurrent retry test"/></label><div class="cd-actions"><button type="button" data-action="submit-review" class="cd-primary cursor-interaction">Record review</button>${btn('review-cancel','Cancel')}</div></form>`:''}`;}

  function inspector(m){const s=m.s;let title='',body='';if((['Working','Clarification'].includes(s.phase)||s.stopped)&&s.panel==='receipt'){title=s.task==='bug'?'Verification receipt':'Source record';body='<span class="cd-amber">Pending</span><h2 style="margin-top:8px">No completed receipt at this step</h2><p>Completed checks and captured sources will appear here as they become available.</p><div class="cd-small">This is a recorded intermediate state in the sample session.</div>';}else if((['Working','Clarification'].includes(s.phase)||s.stopped)&&s.panel.startsWith('evidence')){title='Available evidence';body='<span class="cd-kicker">This sample state</span><h2 style="margin-top:8px">Result evidence is not ready</h2><p>The request is retained. A completed capture or check has not been attached to this result yet.</p>';}else if(s.task==='question'&&s.phase==='Failure'&&(s.panel.startsWith('evidence')||s.panel==='receipt')){title='Source record';body='<span class="cd-red">No source captured</span><h2 style="margin-top:8px">Forecast request timed out</h2><p>There is no returned forecast for this attempt. Retry to create a new capture.</p>';}else if(s.panel==='activity'){title='Activity';body=`<div class="cd-small" style="margin-bottom:18px">Recorded events · sample session</div>${(s.task==='bug'?[['You','Requested a retry fix','14:30:00'],['Conductor','Captured the base revision','14:30:01'],['Tool','Reproduced duplicate charge','14:30:05'],[s.agent,'Proposed a change','14:30:18'],['Conductor',s.phase==='Failure'?'17 passed · 1 failed':'18 tests passed','14:30:24']]:[['You','Asked for a running window','08:00:00'],[s.agent,'Asked about run duration','08:00:01'],['You','Selected a run preference','08:00:04'],['Tool',s.phase==='Failure'?'Forecast request timed out':'Returned hourly forecast','08:00:07'],[s.agent,'Compared weather windows','08:00:09']]).slice(0,s.phase==='Clarification'?2:s.phase==='Working'?4:5).map((a,i)=>`<div class="cd-history-item"><span class="${i   function agentPane(m){return `<aside class="cd-agent-pane" aria-label="Illustrative agent terminal"><div class="cd-kicker">${escape(m.s.agent)} · agent pane</div><pre><span class="cd-command">› ${m.s.task==='bug'?'Fix duplicate payments on retry':'Find a comfortable running window'}</span>

${m.s.task==='bug'?'Read payments/retry.rs\nRead tests/payment_retry.rs\n\nThe retry allocates a new key.\nI’ll preserve the original key\nand check concurrent attempts.':'Received the selected run preference.\n\nI’ll compare the morning forecast\nwith the afternoon temperatures.'}

<span class="cd-accent">${m.s.phase==='Complete'?'✓ Turn complete':m.s.phase==='Clarification'?'? Waiting for input':m.s.phase==='Failure'?'× Attempt stopped':'● Working'}</span></pre><div class="cd-agent-note">${btn('focus-task','← Return to Conductor','cd-link')}<div class="cd-small">Sample agent output</div></div></aside>`;}
  function render(m){const s=m.s;const status=s.phase==='Working'?['cd-blue','● Working']:s.phase==='Clarification'?['cd-amber','? Needs input']:s.phase==='Failure'?['cd-red',s.stopped?'■ Stopped':'× Needs attention']:s.task==='bug'?[s.accepted?'cd-accent':'cd-amber',s.accepted?'✓ Review accepted':'◉ Ready for review']:['cd-accent','✓ Answered'];

'replay','Replay','',`aria-pressed="${s.panel==='replay'}"`)}</nav><div class="cd-work ${s.panel?'cd-inspecting':''}"><main class="cd-result">${s.notice?`<div class="cd-feedback" role="status">${escape(s.notice)}</div>`:''}${s.sent?`<div class="cd-feedback"><strong>Message sent in preview</strong><p style="margin:5px 0">${escape(s.sent)}</p><span class="cd-small">${s.context?'Attached: '+escape(s.context):'Current task context attached'} · no model call</span></div>`:''}${s.phase==='Clarification'?clarification(m):s.phase==='Working'?working(m):s.stopped?sourceFailure(m):s.task==='bug'?bugResult(m):s.phase==='Failure'?sourceFailure(m):questionResult(m)}</main>${s.panel?inspector(m):''}</div><form class="cd-composer" data-form="message">${s.context&&s.phase!=='Clarification'?`<div class="cd-context"><span>↳ ${escape(s.context)}</span>${btn('clear-context','×','','aria-label="Remove attached context"')}</div>`:''}<div class="cd-compose-row"><textarea aria-label="Follow-up message" name="message" rows="2" placeholder="${s.task==='bug'?'Ask about this change…':'Ask about this forecast…'}">${escape(s.draft)}</textarea><button type="button" data-action="submit-message" class="cursor-interaction" aria-label="Send preview message">Send ↵</button></div><div class="cd-composer-foot"><span>${escape(s.agent)} · runtime default</span><span>Preview only</span></div></form><footer class="cd-footer"><span><kbd>Esc</kbd> back</span><span><kbd>a</kbd> activity</span><span><kbd>e</kbd> evidence</span><span><kbd>r</kbd> replay</span></footer></section>${m.id==='split'?agentPane(m):''}</div></div>`;

  function changePhase(m,phase){clearTimeout(m.timer);m.s.phase=phase;m.s.panel=null;m.s.notice='';m.s.review=false;m.s.accepted=false;m.s.stopped=false;m.s.sent='';render(m);persist();}

  function handle(m,a){const s=m.s;if(a.startsWith('task-')){clearTimeout(m.timer);s.task=a.slice(5);s.phase='Complete';s.choice=0;s.context='';s.draft='';s.sent='';s.notice='';s.panel=null;s.review=false;s.accepted=false;s.stopped=false;}
    else if(a.startsWith('submit-')){const form=m.el.querySelector('[data-form="'+a.slice(7)+'"]');if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}
    else if(a.startsWith('phase-')){changePhase(m,a.slice(6));return;}
    else if(a.startsWith('artifact-')){s.focusArtifact=a.slice(9);}
    else if(a.startsWith('hour-')){s.hour=Number(a.slice(5));}
    else if(['activity','receipt','replay'].includes(a)){s.panel=s.panel===a?null:a;}
    else if(a==='evidence'){s.panel=s.panel?.startsWith('evidence')?null:s.task==='bug'?'evidence-test':'evidence-weather';}
    else if(a.startsWith('evidence-')){s.panel=a;}
    else if(a==='close-panel'){s.panel=null;}
    else if(a==='review'){s.review=true;s.panel=null;}
    else if(a==='review-cancel'){s.review=false;}
    else if(['retry','rerun'].includes(a)){simulate(m);return;}
    else if(a==='advance'){s.phase='Complete';s.notice='Final event in the sample session.';}
    else if(a==='stop'){clearTimeout(m.timer);s.phase='Failure';s.stopped=true;s.notice='Stopped locally in this preview. No process was running.';}
    else if(a==='clear-context'){s.context='';}
    else if(a==='ask-finding'||a==='ask-evidence'){s.context=s.task==='bug'?(a==='ask-finding'?'Finding: duplicate payment keys':s.panel==='evidence-diff'?'Saved diff · a81c3e9':s.panel==='evidence-trace'?'Request trace · base revision':'Concurrent retry test · saved attempt'):'Forecast window · '+['morning','late morning','afternoon','evening'][s.hour];s.panel=null;render(m);m.el.querySelector('textarea').focus();persist();return;}

    render(m);persist();
  }
  for(const m of models){render(m);new ResizeObserver(()=>drawCharts(m)).observe(m.el);m.el.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&m.el.contains(b))handle(m,b.dataset.action);});m.el.addEventListener('input',e=>{if(e.target.name==='message')m.s.draft=e.target.value;if(e.target.name==='context')m.s.context=e.target.value;if(e.target.name==='note')m.s.reviewNote=e.target.value;});m.el.addEventListener('change',e=>{if(e.target.matches('select')){m.s.agent=e.target.value;m.s.notice='Agent selection preview · no session was started.';render(m);persist();}if(e.target.name==='choice'){m.s.choice=Number(e.target.value);render(m);persist();}});m.el.addEventListener('submit',e=>{e.preventDefault();const kind=e.target.dataset.form;if(kind==='choice'){const data=new FormData(e.target);m.s.context=String(data.get('context')||'');simulate(m);}else if(kind==='review'){m.s.reviewNote=String(new FormData(e.target).get('note')||'').trim();if(!m.s.reviewNote)return;m.s.accepted=true;m.s.review=false;m.s.panel='receipt';render(m);persist();}else{const value=String(new FormData(e.target).get('message')||'').trim();if(!value)return;m.s.sent=value;m.s.draft='';m.s.panel=null;render(m);persist();}});m.el.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select');if(e.key==='Escape'){e.preventDefault();m.s.panel=null;m.s.review=false;render(m);return;}if(typing){if(e.key==='Enter'&&!e.shiftKey&&!e.altKey&&e.target.matches('textarea,input[type=text]')){e.preventDefault();handle(m,'submit-'+e.target.closest('[data-form]').dataset.form);}return;}const actions={a:'activity',e:'evidence',r:'replay'};if(actions[e.key]){e.preventDefault();handle(m,actions[e.key]);}});
    if(globalThis.Tweak){const tweak=new Tweak({container:m.el,onChange:()=>{clearTimeout(m.timer);m.s.panel=null;m.s.notice='';m.s.accepted=false;m.s.review=false;render(m);persist();}});tweak.addSelect(m.s,'phase',{label:'Sample state',options:phases});}
  }
  window.addEventListener('openai:set_globals',event=>{const data=event.detail?.globals?.widgetState?.privateContent;if(!data||!Number.isFinite(data.revision)||data.revision<=stateRevision)return;stateRevision=data.revision;for(const m of models){if(data[m.id]){Object.assign(m.s,data[m.id]);render(m);}}});
})();
</script>
