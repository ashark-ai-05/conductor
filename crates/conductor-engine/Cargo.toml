[package]
name = "conductor-engine"
version.workspace = true
edition.workspace = true
description = "Runs a workflow: stages, agents, checks, retries, and the record of it all"
publish = false

[dependencies]
conductor-checks.workspace = true
conductor-herdr.workspace = true
conductor-model.workspace = true
hex.workspace = true
nix = { version = "0.29", features = ["signal", "process"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
